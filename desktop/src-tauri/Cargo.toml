[package]
name = "lorren"
version = "0.0.1"
description = "Lorren desktop app"
edition = "2021"
default-run = "lorren"

[lib]
name = "lorren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3.34"
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp"] }
tokio-util = "0.7.20"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
# The updater plugin's own signature library, at the version the plugin pins: `classify` (updater.rs) matches its error
# type, so the two must be the same crate.
minisign-verify = "=0.3.0"
semver = "1.0.28"
tauri-plugin-opener = "2.7.2"
base64 = "0.22.1"

[features]
fake-engine = []

[[bin]]
name = "fake-engine"
path = "src/bin/fake_engine.rs"
required-features = ["fake-engine"]

[dev-dependencies]
# `tauri::test::mock_app` + the real updater plugin, so a test can ask `Update::verify` itself what a bad signature gives.
tauri = { version = "2", features = ["test"] }
