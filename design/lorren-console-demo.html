<!doctype html>
<!--
  Lorren console, design reference (2026-09-25). The Control Room design
  (design/ControlRoom.dc.html, chosen 2026-08-18) ported to a live page, plus the
  Chat tab approved on 2026-09-25. This is the web half of the Tauri-versus-native
  demo that decided the shell; see
  docs/superpowers/specs/2026-09-25-lorren-desktop-design.md, section 4.
  Demo data only: nothing here talks to the engine.
  Open in a browser. Open with "#chat" to start on the Chat tab, or "#chat-final"
  to show the reply already finished.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#090b0e">
<title>Lorren console — design reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: oklch(0.15 0.006 255); --text: oklch(0.95 0.004 255);
    --l27: oklch(0.27 0.008 255); --l22: oklch(0.22 0.008 255); --l20: oklch(0.20 0.008 255);
    --l24: oklch(0.24 0.008 255); --l28: oklch(0.28 0.008 255); --l30: oklch(0.30 0.008 255);
    --l32: oklch(0.32 0.008 255); --t21: oklch(0.21 0.008 255); --sel: oklch(0.19 0.008 255);
    --field: oklch(0.185 0.006 255); --code: oklch(0.175 0.006 255);
    --d50: oklch(0.50 0.008 255); --d52: oklch(0.52 0.008 255); --d55: oklch(0.55 0.008 255);
    --d58: oklch(0.58 0.008 255); --d60: oklch(0.60 0.008 255); --d62: oklch(0.62 0.008 255);
    --d66: oklch(0.66 0.008 255); --d68: oklch(0.68 0.008 255); --d70: oklch(0.70 0.008 255);
    --d72: oklch(0.72 0.008 255); --d74: oklch(0.74 0.008 255); --d80: oklch(0.80 0.008 255);
    --d86: oklch(0.86 0.008 255);
    --accent: oklch(0.76 0.09 70); --shared: oklch(0.70 0.07 250); --flame: oklch(0.66 0.09 30);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font-family: "Archivo", ui-sans-serif, system-ui, sans-serif; color: var(--text); font-size: 13px; overflow: hidden; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .cap { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: var(--d60); }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .tab { display: flex; align-items: center; padding: 0 18px; font-size: 12.5px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--d55); user-select: none; }
  .tab:hover { color: var(--d80); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .btn { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em; cursor: pointer; user-select: none; }
  .btn.accent { border: 1px solid var(--accent); color: var(--accent); }
  .btn.accent:hover { background: oklch(0.76 0.09 70 / 0.12); }
  .act { cursor: pointer; }
  .act:hover { color: var(--text); }
  ::selection { background: oklch(0.70 0.07 250 / 0.35); }
  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--l30) transparent; }

  /* chat prose, the output of a markdown renderer */
  .prose { font-size: 14px; line-height: 1.6; color: var(--d86); }
  .prose h3 { font-size: 15px; font-weight: 600; color: var(--text); margin: 2px 0 8px 0; }
  .prose ul { list-style: none; margin: 0 0 12px 0; padding: 0; }
  .prose li { position: relative; padding-left: 16px; margin: 2px 0; }
  .prose li::before { content: ""; position: absolute; left: 1px; top: 0.68em; width: 5px; height: 5px; background: var(--d55); }
  .prose b { color: var(--text); font-weight: 600; }
  .prose p { margin: 0 0 8px 0; }
  .prose table { border-collapse: collapse; margin: 4px 0 14px 0; width: 100%; max-width: 560px; table-layout: fixed; }
  .prose th { text-align: left; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--d55); font-weight: 400; padding: 0 0 8px 0; border-bottom: 1px solid var(--l27); }
  .prose td { padding: 7px 0; border-bottom: 1px solid var(--l20); font-size: 13px; }
  .prose td.n { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text); }
  .prose .codewrap { border: 1px solid var(--l24); background: var(--code); margin: 4px 0 14px 0; max-width: 620px; }
  .prose .codehead { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--l24); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--d55); letter-spacing: 0.08em; }
  .prose pre { margin: 0; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.7; color: var(--d86); white-space: pre; }
  .prose .k-num { color: var(--shared); } .prose .k-op { color: var(--d66); } .prose .k-cm { color: var(--d55); }
  .prose math { font-size: 17px; color: var(--text); margin: 2px 0 10px 0; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  input.composer { flex-grow: 1; border: 1px solid var(--l30); background: var(--field); padding: 9px 12px; font-family: "Archivo", sans-serif; font-size: 13px; color: var(--text); outline: none; }
  input.composer:focus { border-color: var(--d50); }
  input.composer::placeholder { color: var(--d55); }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const C = {
  accent: 'oklch(0.76 0.09 70)', shared: 'oklch(0.70 0.07 250)', flame: 'oklch(0.66 0.09 30)',
  dim: 'oklch(0.55 0.008 255)', bright: 'oklch(0.95 0.004 255)', free: 'oklch(0.24 0.008 255)'
};
const TABS = ['Chat', 'Swarm', 'Models', 'Requests', 'Logs'];
let tab = location.hash.startsWith('#chat') ? 'Chat' : 'Swarm';

/* ---------------- demo data: the ControlRoom artboard's own values ---------------- */
const WORDS = ('the plan should weigh bandwidth before compute so each block stays resident while the ' +
  'scheduler admits the next sequence and the prefill co-runs with six decoders at a steady cadence ' +
  'attention reads the pool by block table so a shared prefix is held once and never copied').split(' ');
const lanes = [
  { id: 's0', name: 'planner', tool: 'chat.completions', state: 'DECODE', ctx: 1842, base: 5.4, ttft: '0.38 s', text: 'the third constraint is bandwidth, not compute — so the plan should' },
  { id: 's1', name: 'reader.a', tool: 'tools/read_file', state: 'DECODE', ctx: 964, base: 5.9, ttft: '0.31 s', text: 'src/model.c lines 480–560 implement the per-head attention loop' },
  { id: 's2', name: 'reader.b', tool: 'tools/read_file', state: 'DECODE', ctx: 1103, base: 5.7, ttft: '0.34 s', text: 'the block table maps logical positions to physical blocks by' },
  { id: 's3', name: 'critic', tool: 'chat.completions', state: 'PREFILL', ctx: 2410, base: 0, ttft: '—', text: '1,536 of 2,410 tokens adopted from the shared prefix' },
  { id: 's4', name: 'grep.rs', tool: 'tools/search', state: 'DECODE', ctx: 512, base: 6.1, ttft: '0.22 s', text: 'no match for pool_for_rows outside src/kernels/vec.c, which is' },
  { id: 's5', name: 'summarizer', tool: 'chat.completions', state: 'DECODE', ctx: 1287, base: 5.6, ttft: '0.36 s', text: 'in short: attention was the last single-threaded stage in the' },
  { id: 's6', name: 'test.gen', tool: 'chat.completions', state: 'DECODE', ctx: 733, base: 6.0, ttft: '0.27 s', text: 'static void test_shared_scratch_is_per_worker(void) { /* mutation' },
  { id: 's7', name: 'judge', tool: 'chat.completions', state: 'QUEUED', ctx: 0, base: 0, ttft: '—', text: 'waiting on admission — reserve held for the prefill in flight' }
];
lanes.forEach(l => { l.rate = l.base; });
let spark = []; for (let i = 0; i < 24; i++) spark.push(17 + ((i * 11) % 9) - (i > 17 ? 4 : 0));
let steps = []; for (let i = 0; i < 60; i++) { const p = (i > 14 && i < 19) || (i > 43 && i < 49); steps.push({ p, h: p ? 54 : 16 + ((i * 7) % 7) }); }
let stall = 86;
const blockColor = []; for (let i = 0; i < 384; i++) {
  let bg = C.free;
  if (i < 48) bg = C.shared; else if (i >= 52 && i < 100) bg = C.accent;
  else if (i >= 100 && i < 148) bg = 'oklch(0.68 0.08 70)'; else if (i >= 148 && i < 188) bg = 'oklch(0.58 0.06 70)';
  else if (i >= 356 && i < 362) bg = C.flame;
  blockColor.push(bg);
}
const fmt = n => n.toLocaleString('en-US');
let seed = 7; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

function simulate() {
  for (const l of lanes) {
    if (l.state !== 'DECODE') continue;
    l.rate = Math.max(4.6, Math.min(6.6, l.base + (rnd() - 0.5) * 0.6));
    l.ctx += Math.round(l.rate / 2);
    l.text = (l.text + ' ' + WORDS[Math.floor(rnd() * WORDS.length)]).slice(-120);
  }
  const agg = lanes.reduce((s, l) => s + (l.state === 'DECODE' ? l.rate : 0), 0);
  spark.shift(); spark.push(Math.max(8, Math.min(30, 17 + (agg - 34.7) * 3 + (rnd() - 0.5) * 3)));
  steps.shift(); const p = rnd() < 0.08; steps.push({ p, h: p ? 54 : 16 + Math.floor(rnd() * 7) });
  stall = Math.round(70 + rnd() * 40);
}

/* ---------------- shared chrome ---------------- */
function topbar() {
  const tabs = TABS.map(t => `<div class="tab${t === tab ? ' on' : ''}" data-tab="${t}">${t}</div>`).join('');
  return `
  <div style="height:54px;flex-shrink:0;border-bottom:1px solid var(--l27);display:flex;align-items:stretch;">
    <div style="display:flex;align-items:center;gap:10px;padding:0 22px;border-right:1px solid var(--l22);">
      <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em;">lorren</span>
      <span class="mono" style="font-size:10px;color:var(--d60);border:1px solid var(--l30);padding:2px 5px;">0.1.0</span>
    </div>
    <div style="display:flex;align-items:stretch;">${tabs}</div>
    <div style="flex-grow:1;"></div>
    <div class="mono" style="display:flex;align-items:center;gap:22px;padding:0 22px;font-size:11px;color:var(--d68);">
      <span style="display:flex;align-items:center;gap:7px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--accent);"></span>serving</span>
      <span>127.0.0.1:8080</span>
      <span style="color:var(--d55);">t=8</span>
      <span style="color:var(--d55);">kv q8</span>
      <span style="color:var(--d55);">9.4/15.6 GB</span>
    </div>
  </div>`;
}
function statusbar() {
  return `
  <div class="mono" style="height:30px;flex-shrink:0;border-top:1px solid var(--l27);display:flex;align-items:center;gap:20px;padding:0 22px;font-size:10px;color:var(--d52);">
    <span>session 4h 12m</span><span>1,284 requests</span><span>0 refused</span><span>0 evictions</span>
    <div style="flex-grow:1;"></div>
    <span>design reference · 2026-09-25</span>
  </div>`;
}

/* ---------------- Swarm (ControlRoom artboard) ---------------- */
function swarm() {
  const agg = lanes.reduce((s, l) => s + (l.state === 'DECODE' ? l.rate : 0), 0).toFixed(1);
  const sp = spark.map((v, i) => (i * 5.1).toFixed(1) + ',' + v.toFixed(1)).join(' ');
  const kpis = [
    { label: 'ACTIVE', value: '7', unit: 'of 8 admitted', foot: '2 queued, 0 refused' },
    { label: 'TTFT p50 / p99', value: '0.41', unit: 's / 1.9 s', foot: 'shared prefix skips 1,536 tok' },
    { label: 'POOL', value: '77', unit: '% of 8.00 GB', foot: 'give-back armed at 1.5 GB free' }
  ].map(k => `
      <div style="flex-grow:1;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--l22);">
        <div class="cap">${k.label}</div>
        <div style="display:flex;align-items:baseline;gap:7px;">
          <span class="mono num" style="font-size:28px;font-weight:500;line-height:1;">${k.value}</span>
          <span class="mono" style="font-size:11px;color:var(--d60);">${k.unit}</span>
        </div>
        <div class="mono" style="font-size:10px;color:var(--d55);">${k.foot}</div>
      </div>`).join('');
  const rows = lanes.map(l => {
    const hue = l.state === 'PREFILL' ? C.flame : (l.state === 'QUEUED' ? C.dim : C.accent);
    const rate = l.state === 'DECODE' ? l.rate.toFixed(1) : '—';
    return `
      <div style="display:grid;grid-template-columns:34px 168px 76px minmax(0,1fr) 84px 72px 66px;gap:14px;align-items:center;padding:0 22px;height:46px;border-bottom:1px solid var(--l20);">
        <span class="mono" style="font-size:11px;color:var(--d58);">${l.id}</span>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span class="ell" style="font-size:13px;font-weight:500;">${l.name}</span>
          <span class="mono ell" style="font-size:10px;color:var(--d55);">${l.tool}</span>
        </div>
        <span class="mono" style="font-size:9.5px;letter-spacing:0.08em;border:1px solid ${hue};color:${hue};padding:3px 0;text-align:center;">${l.state}</span>
        <span class="mono" style="font-size:11px;color:var(--d70);white-space:nowrap;overflow:hidden;direction:rtl;text-align:left;"><bdi>${l.text}</bdi></span>
        <span class="mono num" style="font-size:12px;text-align:right;">${l.ctx ? fmt(l.ctx) : '—'}</span>
        <span class="mono num" style="font-size:12px;text-align:right;color:${rate === '—' ? C.dim : C.bright};">${rate}</span>
        <span class="mono num" style="font-size:12px;text-align:right;color:var(--d68);">${l.ttft}</span>
      </div>`;
  }).join('');
  const bars = steps.map(s => `<div style="flex-grow:1;height:${s.h}px;background:${s.p ? C.flame : C.accent};"></div>`).join('');
  const blocks = blockColor.map(b => `<div style="height:9px;background:${b};"></div>`).join('');
  const models = [
    { name: 'nexus.gguf (Llama-3.2-3B)', size: '1.88 GB', state: 'serving', dot: C.accent },
    { name: 'Qwen3-4B-Instruct-2507-Q4_K_M', size: '2.33 GB', state: 'on disk', dot: 'oklch(0.50 0.02 255)' },
    { name: 'Llama-3.2-3B-Instruct-Q4_K_M', size: '1.88 GB', state: 'on disk', dot: 'oklch(0.38 0.01 255)' }
  ].map(m => `
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="width:6px;height:6px;background:${m.dot};flex-shrink:0;"></span>
        <span class="mono ell" style="font-size:11px;flex-grow:1;min-width:0;">${m.name}</span>
        <span class="mono num" style="font-size:11px;color:var(--d58);">${m.size}</span>
        <span class="mono" style="font-size:10px;color:var(--d52);width:54px;text-align:right;">${m.state}</span>
      </div>`).join('');
  return `
  <div style="flex-grow:1;display:flex;flex-direction:column;min-height:0;">
    <div style="height:112px;flex-shrink:0;display:flex;border-bottom:1px solid var(--l27);">
      <div style="width:330px;flex-shrink:0;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--l22);">
        <div class="cap">AGGREGATE THROUGHPUT</div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;">
          <div style="display:flex;align-items:baseline;gap:8px;">
            <span class="mono num" style="font-size:44px;font-weight:500;line-height:1;letter-spacing:-0.02em;">${agg}</span>
            <span class="mono" style="font-size:12px;color:var(--d60);">tok/s</span>
          </div>
          <svg width="118" height="34" viewBox="0 0 118 34" fill="none" style="margin-bottom:2px;">
            <polyline points="${sp}" stroke="${C.accent}" stroke-width="1.4" stroke-linejoin="round"></polyline>
          </svg>
        </div>
        <div class="mono" style="font-size:10px;color:var(--d55);">60 s window &middot; bar 17.7 at N=8</div>
      </div>
      ${kpis}
      <div style="width:268px;flex-shrink:0;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-between;">
        <div class="cap">WORST DECODE STALL</div>
        <div style="display:flex;align-items:baseline;gap:7px;">
          <span class="mono num" style="font-size:28px;font-weight:500;line-height:1;">${stall}</span>
          <span class="mono" style="font-size:11px;color:var(--d60);">ms of 250 budget</span>
        </div>
        <div style="height:4px;background:var(--l24);position:relative;">
          <div style="position:absolute;left:0;top:0;bottom:0;width:${(stall / 250 * 100).toFixed(1)}%;background:${C.accent};"></div>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-grow:1;min-height:0;">
      <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--l27);">
        <div style="display:flex;align-items:center;gap:12px;padding:13px 22px 11px 22px;">
          <span style="font-size:13px;font-weight:600;">Agents</span>
          <span class="mono" style="font-size:11px;color:var(--d55);">8 admitted &middot; 2 queued &middot; step 41,208</span>
        </div>
        <div class="mono" style="display:grid;grid-template-columns:34px 168px 76px minmax(0,1fr) 84px 72px 66px;gap:14px;padding:0 22px 8px 22px;font-size:10px;letter-spacing:0.1em;color:var(--d55);border-bottom:1px solid var(--l27);">
          <div>ID</div><div>AGENT</div><div>STATE</div><div>OUTPUT</div>
          <div style="text-align:right;">CONTEXT</div><div style="text-align:right;">RATE</div><div style="text-align:right;">TTFT</div>
        </div>
        ${rows}
        <div style="flex-grow:1;"></div>
        <div style="border-top:1px solid var(--l27);padding:14px 22px 16px 22px;display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <span style="font-size:12px;font-weight:600;">Decode interval</span>
            <span class="mono" style="font-size:10px;color:var(--d55);">last 240 steps &middot; prefill co-runs marked</span>
            <div style="flex-grow:1;"></div>
            <div class="mono" style="display:flex;gap:16px;font-size:10px;color:var(--d55);">
              <span style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;background:${C.accent};"></span>decode</span>
              <span style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;background:${C.flame};"></span>prefill</span>
            </div>
          </div>
          <div style="position:relative;height:60px;border-bottom:1px solid var(--l27);">
            <div style="position:absolute;left:0;right:0;top:0;border-top:1px dashed oklch(0.45 0.06 30);"></div>
            <span class="mono" style="position:absolute;right:0;top:-15px;font-size:9.5px;color:oklch(0.58 0.06 30);">250 ms</span>
            <div style="display:flex;gap:2px;align-items:flex-end;height:100%;">${bars}</div>
          </div>
        </div>
      </div>
      <div style="width:396px;flex-shrink:0;display:flex;flex-direction:column;">
        <div style="padding:13px 20px 11px 20px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--l27);">
          <span style="font-size:13px;font-weight:600;">KV pool</span>
          <span class="mono" style="font-size:11px;color:var(--d55);">384 blocks &times; 16 tok</span>
          <div style="flex-grow:1;"></div>
          <span class="mono num" style="font-size:11px;color:var(--d68);">6.14 / 8.00 GB</span>
        </div>
        <div style="padding:16px 20px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--l22);">
          <div style="display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;">${blocks}</div>
          <div class="mono" style="display:flex;flex-direction:column;gap:7px;font-size:10px;color:var(--d58);">
            <div style="display:flex;align-items:center;gap:8px;"><span style="width:9px;height:9px;background:${C.shared};"></span><span style="color:var(--d72);">48 blocks, refcount 8</span><span>system prompt, held once</span></div>
            <div style="display:flex;align-items:center;gap:8px;"><span style="width:9px;height:9px;background:${C.accent};"></span><span style="color:var(--d72);">136 blocks, refcount 1</span><span>per-agent context</span></div>
            <div style="display:flex;align-items:center;gap:8px;"><span style="width:9px;height:9px;background:${C.free};"></span><span style="color:var(--d72);">200 blocks free</span><span>returnable under pressure</span></div>
          </div>
        </div>
        <div style="padding:16px 20px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--l22);">
          <div style="display:flex;align-items:baseline;justify-content:space-between;">
            <span class="cap">PREFIX REUSE</span>
            <span class="mono num" style="font-size:20px;font-weight:500;color:${C.shared};">71%</span>
          </div>
          <div style="height:4px;background:var(--l24);display:flex;"><div style="width:71%;background:${C.shared};"></div></div>

        </div>

        ${facts([['temperature', '0.7'], ['top_p', '0.90'], ['top_k', '40'], ['repeat_penalty', '1.10'], ['seed', 'random'], ['max_tokens', '1,024']])}
      </div>
      <div style="flex-grow:1;"></div>
    </div>
  </div>`;
}
function send() {
  const inp = document.getElementById('composer');
  const text = (inp.value || '').trim() || 'Or should I wait for the close?';
  inp.value = '';
  msgs.push({ who: 'YOU', time: '14:23:10', text });
  const m = { who: 'NEXUS', time: '14:23:11', blocks: REPLY2, shown: 0, done: false };
  msgs.push(m);
  renderMessages();
  startStream(m);
}

/* ---------------- frame ---------------- */
let chatStarted = location.hash === '#chat-final';
if (chatStarted) { msgs[1].done = true; }
function render() {
  const body = tab === 'Swarm' ? swarm() : tab === 'Chat' ? chatTab() : tab === 'Models' ? modelsTab() : tab === 'Requests' ? requestsTab() : logsTab();
  document.getElementById('app').innerHTML = topbar() + body + statusbar();
  document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => { tab = el.dataset.tab; render(); }));
  if (tab === 'Chat') {
    renderMessages();
    document.getElementById('send').addEventListener('click', send);
    document.getElementById('composer').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    if (!chatStarted) { chatStarted = true; startStream(msgs[1]); }
  }
}
render();
setInterval(() => { simulate(); if (tab === 'Swarm') render(); }, 500);
</script>
</body>
</html>
